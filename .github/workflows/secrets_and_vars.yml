name: Secrets and variables

on:
  workflow_dispatch:

jobs:
  print-config:
    runs-on: ubuntu-latest
    steps:
      - name: Echo values
        env:
          API_KEY: ${{ secrets.API_KEY }}
          GREETING: ${{ vars.GREETING }}
        run: |
          echo "Greeting: $GREETING"
          echo "API key: $API_KEY"